<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DK-AI — Ember theme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D12;
    --surface:#12151C;
    --surface-2:#191D26;
    --line:#242A36;
    --ember:#FF6B35;
    --ember-dim:#7A3A20;
    --teal:#3EC9A7;
    --text:#F3F1EA;
    --text-dim:#8A8F9C;
    --text-faint:#565C68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#05060A;
    display:flex;
    justify-content:center;
    padding:40px 16px;
    font-family:'Inter',sans-serif;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--ink);
    border-radius:36px;
    border:8px solid #000;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    position:relative;
  }
  .noise{
    position:absolute; inset:0;
    background-image:
      radial-gradient(ellipse 500px 300px at 20% -5%, rgba(255,107,53,0.10), transparent 60%),
      radial-gradient(ellipse 400px 260px at 100% 10%, rgba(62,201,167,0.06), transparent 55%);
    pointer-events:none;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 22px 6px;
    color:var(--text-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }
  .header{
    padding:18px 22px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    position:relative; z-index:1;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    color:var(--text);
    letter-spacing:-0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .orb{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #FFB088, var(--ember) 55%, var(--ember-dim) 100%);
    box-shadow:0 0 0 0 rgba(255,107,53,.5);
    animation:breathe 2.8s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,107,53,.35); transform:scale(1); }
    50%{ box-shadow:0 0 14px 4px rgba(255,107,53,.15); transform:scale(1.06); }
  }
  .toggle{
    display:flex; background:var(--surface-2); border-radius:999px; padding:3px;
    border:1px solid var(--line); position:relative; width:150px;
  }
  .toggle button{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    font-family:'Inter'; font-size:13px; font-weight:500; padding:8px 0;
    border-radius:999px; cursor:pointer; position:relative; z-index:1;
    transition:color .25s;
  }
  .toggle button.active{ color:#1a0e07; }
  .slider{
    position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:calc(100% - 6px);
    background:var(--ember); border-radius:999px;
    transition:transform .28s cubic-bezier(.65,0,.35,1);
  }
  .toggle.search .slider{ transform:translateX(100%); background:var(--teal); }
  .toggle.search button.active{ color:#062822; }

  .modelrow{
    display:flex; align-items:center; justify-content:space-between;
    margin:16px 22px 0; padding:11px 14px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    position:relative; z-index:1;
  }
  .modelrow .label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; font-family:'JetBrains Mono',monospace;}
  .modelrow .val{ font-size:14px; color:var(--text); margin-top:2px; }
  .modelrow .chev{ color:var(--text-dim); font-size:13px; }

  .greeting{
    margin:20px 22px 0;
    padding:26px 22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  .greeting::before{
    content:"";
    position:absolute; top:-40%; right:-20%;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,107,53,.18), transparent 70%);
  }
  .greeting h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    color:var(--text); margin:0 0 12px; position:relative;
  }
  .greeting h1 span{ color:var(--ember); }
  .greeting p{
    font-size:14.5px; line-height:1.6; color:var(--text-dim); margin:0; position:relative;
  }
  .greeting b{ color:var(--text); font-weight:500; }
  .tag{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:16px; padding:5px 11px;
    border:1px solid var(--line); border-radius:999px;
    font-size:11.5px; color:var(--teal); font-family:'JetBrains Mono',monospace;
    position:relative;
  }
  .tag::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); }

  .spacer{ height:220px; }

  .inputbar{
    margin:0 16px 26px; display:flex; align-items:center; gap:10px;
    position:relative; z-index:1;
  }
  .attach{
    width:44px; height:44px; border-radius:14px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--teal); font-size:17px; flex-shrink:0;
  }
  .field{
    flex:1; height:44px; border-radius:14px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; padding:0 14px;
    color:var(--text-faint); font-size:14px;
  }
  .send{
    width:44px; height:44px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg, var(--ember), #E0431A);
    display:flex; align-items:center; justify-content:center; color:#1a0e07; font-size:16px;
  }
  .homebar{ display:flex; justify-content:center; padding-bottom:10px; }
  .homebar div{ width:120px; height:4px; border-radius:3px; background:var(--text-faint); opacity:.5;}
</style>
</head>
<body>
<div class="phone">
  <div class="noise"></div>
  <div class="statusbar"><span>10:56</span><span>5G · 92%</span></div>

  <div class="header">
    <div class="wordmark"><span class="orb"></span>DK-AI</div>
    <div class="toggle" id="toggle">
      <div class="slider"></div>
      <button class="active" onclick="setMode('chat')">Chat</button>
      <button onclick="setMode('search')">Search</button>
    </div>
  </div>

  <div class="modelrow">
    <div><div class="label">Model</div><div class="val">Gemini Flash</div></div>
    <div class="chev">⌄</div>
  </div>

  <div class="greeting">
    <h1>Hey — I'm <span>DK-AI</span>.</h1>
    <p>Ask a question, hand me some code, or flip to <b>Search</b> for answers grounded in live sources.</p>
    <div class="tag">ready</div>
  </div>

  <div class="spacer"></div>

  <div class="inputbar">
    <div class="attach">＋</div>
    <div class="field">Message DK-AI…</div>
    <div class="send">➤</div>
  </div>
  <div class="homebar"><div></div></div>
</div>

<script>
function setMode(mode){
  const t = document.getElementById('toggle');
  const btns = t.querySelectorAll('button');
  btns.forEach(b => b.classList.remove('active'));
  if(mode === 'search'){
    t.classList.add('search');
    btns[1].classList.add('active');
  } else {
    t.classList.remove('search');
    btns[0].classList.add('active');
  }
}
</script>
</body>
</html>
