<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DK-AI</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand">DK-<span>AI</span></div>
    <div class="modes">
      <button class="mode-btn active" data-mode="chat">Chat</button>
      <button class="mode-btn" data-mode="search">Search</button>
    </div>
  </div>

  <div class="model-bar">
    <span>Model:</span>
    <select id="modelSelect">
      <option value="gemini">Gemini Flash (fast, supports photos)</option>
      <option value="groq">Groq (fast, text only)</option>
      <option value="openrouter">OpenRouter</option>
    </select>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="msg bot">
      <div class="bubble">
        <div class="bot-text">Hi, I'm <b>DK-AI</b> 👋<br><br>Ask me anything, request code, or switch to <b>Search</b> mode for web-grounded answers with sources.</div>
      </div>
    </div>
  </div>

  <div class="image-preview-bar" id="imagePreviewBar" style="display:none;">
    <img id="imagePreviewThumb" alt="Attached image preview">
    <button type="button" id="removeImageBtn" aria-label="Remove image">✕</button>
  </div>

  <form class="composer" id="composer">
    <button type="button" id="attachBtn" aria-label="Attach image">📎</button>
    <input type="file" id="imageInput" accept="image/*" hidden>
    <textarea id="userInput" rows="1" placeholder="Message DK-AI..."></textarea>
    <button type="submit" id="sendBtn" aria-label="Send message">➤</button>
  </form>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
