<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DK-AI</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">DK-<span>AI</span></div>
      <div class="modes">
        <button class="mode-btn active" data-mode="chat">💬 Chat</button>
        <button class="mode-btn" data-mode="search">🔎 Search</button>
      </div>
    </header>

    <div class="model-bar">
      <label for="modelSelect">Model:</label>
      <select id="modelSelect">
        <option value="gemini">Gemini Flash (fast, supports photos)</option>
        <option value="groq">Llama 3.3 70B via Groq (stronger, text only)</option>
      </select>
    </div>

    <main id="chatWindow" class="chat-window">
      <div class="msg bot">
        <div class="bubble">
          Hi, I'm <b>DK-AI</b> 👋<br/>
          Ask me anything, request code, or switch to <b>Search</b> mode for web-grounded answers with sources.
        </div>
      </div>
    </main>

    <div id="imagePreviewBar" class="image-preview-bar" style="display:none;">
      <img id="imagePreviewThumb" src="" alt="attached photo" />
      <button type="button" id="removeImageBtn">✕</button>
    </div>

    <form id="composer" class="composer">
      <input type="file" id="imageInput" accept="image/*" style="display:none;" />
      <button type="button" id="attachBtn" title="Attach a photo">📎</button>
      <textarea id="userInput" placeholder="Message DK-AI..." rows="1"></textarea>
      <button type="submit" id="sendBtn">➤</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
